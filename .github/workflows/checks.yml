name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Python syntax
        run: git ls-files -z '*.py' | xargs -0 -r python -m py_compile

      - name: JS syntax
        run: git ls-files -z '*.js' '*.mjs' | xargs -0 -r -n1 node --check

      - name: SKILL.md frontmatter and no media
        run: python .github/scripts/check_repo.py
